<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azort Control Panel</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  body.client-page{background:#000}
  .welcome-screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#000;animation:welcome-out .7s ease 1.2s forwards;pointer-events:none}
  .welcome-screen h1{color:#fff;font-size:clamp(30px,6vw,64px);letter-spacing:0;animation:welcome-in .6s ease both}
  .welcome-screen p{color:#777;text-align:center;margin:12px 0 0}
  .client-page .app-shell{opacity:0;animation:page-in .7s ease .8s forwards}
  .client-hero{padding:28px 0 22px}
  .bot-grid{margin-top:18px}
  @keyframes welcome-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes welcome-out{to{opacity:0;visibility:hidden}}
  @keyframes page-in{to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.welcome-screen,.welcome-screen h1,.client-page .app-shell{animation:none}.welcome-screen{display:none}.client-page .app-shell{opacity:1}}
</style>
</head>
<body class="client-page">
<div class="welcome-screen" aria-hidden="true"><div><h1>Welcome to Azort</h1><p>Your control panel is loading</p></div></div>
<main class="app-shell">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">A</div><div class="brand-text"><div class="name">Azort Control Panel</div><div class="sub">Your hosted bots</div></div></div>
    <div class="nav-right"><div class="user-chip"><div class="avatar" id="userInitial">?</div><span id="userName">Loading...</span></div><button class="btn-ghost" id="logoutBtn">Sign out</button></div>
  </header>
  <section class="client-hero"><div class="section-label">Overview</div><h1 class="page-title">Your bots</h1><p class="page-sub">Choose a bot to view its status and control it.</p><div class="bot-grid" id="botGrid"></div></section>
</main>
<div class="overlay" id="overlay"><div class="drawer">
  <div class="drawer-top"><h3 id="drawerName">Bot</h3><button class="drawer-close" id="drawerClose">&times;</button></div>
  <div class="status-row"><div class="pulse" id="drawerPulse"><div class="pulse-ring"></div><div class="pulse-ring"></div><div class="pulse-dot"></div></div><span class="status-text" id="drawerStatusText">Offline</span></div>
  <div class="bot-meta"><span>Server <strong class="mono" id="drawerId">-</strong></span><span>Expires <strong id="drawerExpiry">-</strong></span></div>
  <div class="two-col" style="margin-top:22px"><div class="card"><div class="section-label">CPU</div><strong id="drawerCpu">-</strong></div><div class="card"><div class="section-label">Memory</div><strong id="drawerMem">-</strong></div></div>
  <p class="form-note" id="cooldownNote"></p><div class="btn-row"><button class="btn btn-primary" id="restartBtn">Restart bot</button><button class="btn-ghost" id="stopBtn">Stop bot</button></div>
</div></div>
<div class="toast" id="toast"></div>
<div class="watermark"><span class="dot"></span>Azort Development&nbsp;&nbsp;|&nbsp;&nbsp;Built by <b>Arnav</b></div>
<script src="/assets/js/app.js"></script>
</body>
</html>
